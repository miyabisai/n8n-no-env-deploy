version: '3.9'

services:

  # 1. 密鑰獲取服務：負責從 AKV 下載密鑰並寫入 Volume
  secrets-fetcher:
    # 假設您的 Dockerfile 包含 Azure CLI/SDK 和下載密鑰的腳本
    build: .
    # 將 Volume 掛載到容器內部，供寫入密鑰檔案
    volumes:
      - secrets_data:/secrets 
    # 確保這個服務在成功執行腳本後就停止
    restart: "no" 
    # ⚠️ 這裡需要確保您的 build/entrypoint 腳本會將密鑰寫入 /secrets/ 內

  # 2. 資料庫服務
  postgres:
    image: postgres:16
    restart: always
    environment:
      # POSTGRES 支援從檔案讀取密碼，路徑指向共享 Volume 內的密鑰檔案
      POSTGRES_USER_FILE: /secrets/postgres_user.txt
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password.txt
      POSTGRES_NON_ROOT_USER_FILE: /secrets/postgres_non_root_user2.txt
      POSTGRES_NON_ROOT_PASSWORD_FILE: /secrets/postgres_non_root_password.txt
      POSTGRES_DB: n8n
    depends_on:
      secrets-fetcher:
        condition: service_completed_successfully # 確保密鑰檔案存在
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
      - secrets_data:/secrets # 將密鑰 Volume 掛載為只讀 (Read-Only)
    healthcheck:
      # 健康檢查也需要從檔案讀取密鑰，確保 $$(cat /secrets/...) 能正確讀取
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$(cat /secrets/postgres_user.txt)  -d $$(cat /secrets/postgres_db.txt)']
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. 應用程式服務
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    # ❌ 移除不安全的 .env 檔案引用
    env_file:
      - .env 
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      DB_TYPE: ${DB_TYPE}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      # ⚠️ 修正：直接讀取共享 Volume 內的密鑰檔案
      DB_POSTGRESDB_USER_FILE: /secrets/postgres_non_root_user2.txt 
      DB_POSTGRESDB_PASSWORD_FILE: /secrets/postgres_non_root_password.txt
      # 🔑 任何其他的敏感資訊（如加密金鑰）也應該從 Volume 讀取檔案
      # N8N_BASIC_AUTH_PASSWORD_FILE: /secrets/n8n_auth_password.txt
    ports:
      - 5678:5678
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
      - secrets_data:/secrets:ro # ⬅️ 必須掛載共享 Volume，並建議設定為只讀
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_storage:
  n8n_storage:
  secrets_data: # 密鑰共享 Volume